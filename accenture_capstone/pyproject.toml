[project]
name = "healthbot-project"
version = "0.1.0"
description = "LangGraph-based patient health education chatbot"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.17.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "langchain-ollama>=1.1.0",
]